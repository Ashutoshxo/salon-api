<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salon Campaign Generator</title>
</head>
<body>
  <h1>Generate Marketing Image</h1>
  <form id="campaignForm">
    <input type="text" id="businessName" placeholder="Business Name" required />
    <br /><br />
    <textarea id="prompt" placeholder="Enter prompt..." required></textarea>
    <br /><br />
    <button type="submit">Generate Image</button>
  </form>
  <h2>Result:</h2>
  <img id="resultImage" width="400" />
  <p id="caption"></p>

  <script>
    const form = document.getElementById('campaignForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const businessName = document.getElementById('businessName').value;
      const prompt = document.getElementById('prompt').value;

      const res = await fetch('https://salon-api-dira.onrender.com/api/create-campaign%20/', { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
        businessName: document.getElementById('businessName').value,
        prompt: document.getElementById('prompt').value,
        inputType: 'text',
        language: 'en'
        })
    });

      const data = await res.json();
      if(data.success) {
        document.getElementById('resultImage').src = data.data.imageUrl;
        document.getElementById('caption').innerText = data.data.caption;
      } else {
        alert(data.error || data.message);
      }
    });
  </script>
</body>
</html>
