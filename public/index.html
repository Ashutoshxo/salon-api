<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salon Campaign Generator</title>
 <style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    max-width: 600px;
    margin: auto;
    background-color: #f9f9f9;
    color: #333;
  }

  h1, h2 {
    text-align: center;
    color: #444;
  }

  input, textarea, button {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }

  button {
    background-color: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  button:hover {
    background-color: #45a049;
  }

  img {
    display: block;
    margin: 20px auto;
    max-width: 100%;
    border: 1px solid #ccc;
    padding: 5px;
    border-radius: 6px;
  }

  p {
    word-wrap: break-word;
  }

  /* Responsive adjustments */
  @media (max-width: 480px) {
    body {
      padding: 10px;
    }

    input, textarea, button {
      font-size: 14px;
      padding: 10px;
    }

    h1 {
      font-size: 22px;
    }

    h2 {
      font-size: 18px;
    }
  }
</style>

</head>
<body>

  <h1>Generate Marketing Image</h1>

  <form id="campaignForm">
    <input type="text" id="businessName" placeholder="Business Name" required />
    <textarea id="prompt" placeholder="Enter your marketing text..." required></textarea>
    <button type="submit">Generate Image</button>
  </form>

  <h2>Result:</h2>
  <img id="resultImage" alt="Generated Image" />
  <p><b>Caption:</b> <span id="caption"></span></p>
  <p><b>Hashtags:</b> <span id="hashtags"></span></p>
  <p><b>Original Prompt:</b> <span id="orig"></span></p>
  <p><b>Translated Prompt:</b> <span id="trans"></span></p>

  <script>
    const form = document.getElementById('campaignForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const businessName = document.getElementById('businessName').value;
      const prompt = document.getElementById('prompt').value;

      try {
        const res = await fetch('https://salon-api-dira.onrender.com/api/create-campaign', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            businessName,
            textInput: prompt,   
            inputType: 'text',
            language: 'en'
          })
        });

        const data = await res.json();

        if (data.success) {
          const c = data.campaign;

          document.getElementById('resultImage').src = c.imageUrl;
          document.getElementById('caption').innerText = c.caption;
          document.getElementById('hashtags').innerText = c.hashtags.join(' ');
          document.getElementById('orig').innerText = c.originalPrompt;
          document.getElementById('trans').innerText = c.translatedPrompt;
        } else {
          alert(data.error || data.message);
        }

      } catch (err) {
        console.error(err);
        alert('Failed to connect to the server. Make sure your API is live.');
      }
    });
  </script>

</body>
</html>
